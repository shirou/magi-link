<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Magi Link</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b10;
        color: #e8e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loading {
        position: absolute;
        font-size: 14px;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }
      canvas {
        display: block;
        outline: none;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading Magi Link…</div>
    <script src="wasm_exec.js"></script>
    <script>
      (async () => {
        try {
          const go = new Go();
          const result = await WebAssembly.instantiateStreaming(
            fetch("main.wasm"),
            go.importObject
          );
          document.getElementById("loading").remove();
          go.run(result.instance);
        } catch (err) {
          const el = document.getElementById("loading");
          if (el) el.textContent = "Failed to load: " + err;
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
