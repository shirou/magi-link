# line → 3way → line: the canonical bucket-relay example.
# First line walks from caster, its impact becomes the new origin.
# 3way expands that origin into 3 adjacent hexes (dir-1, dir, dir+1).
# The second line walks from each of those 3 origins.

name        = "line → 3way → line fans out from first impact"
description = "Demonstrates bucket-relay: origin propagates through steps"

[battlefield]
grid_width  = 20
grid_height = 15

[[battlefield.units]]
id     = 1
name   = "Player"
pos    = [2, 7]
hp     = 100
player = true

[input]
caster    = [2, 7]
clicked   = [8, 7]
direction = 0

[[input.spells]]
id       = "line1"
type     = "target"
shape    = "line"
range    = 3
stacking = "full"

[[input.spells]]
ref = "3way"

[[input.spells]]
id       = "line2"
type     = "target"
shape    = "line"
range    = 2
stacking = "full"

[expected]
# Line1 contributes 3 hexes from caster. 3way expands the impact into
# 3 origins. Line2 walks 2 steps from each (with possible overlap).
# Lower bound: 3 (line1) + 3 (3way origins, counted as walked by line2 start)
# + a couple more from line2 steps. Minimum 5 unique hexes.
hex_count_min = 5
