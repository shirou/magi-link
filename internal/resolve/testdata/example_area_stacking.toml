# Example: area + area stacking uses incremental radius, not full stacking
# This file demonstrates inline spell definitions and stacking assertions.

name        = "area + area stacking: second area adds +1 radius"
description = "Same-type stacking must be weaker than cross-type combos"

[battlefield]
grid_width  = 12
grid_height = 10

[[battlefield.units]]
id     = 1
name   = "Player"
pos    = [5, 5]
hp     = 100
player = true

[input]
caster    = [5, 5]
clicked   = [5, 5]
direction = 0

# First area: radius 1 → 7 hexes (center + 6 neighbors)
[[input.spells]]
ref = "area"

# Second area: inline definition identical to first; with increment stacking
# the effective radius becomes 2 + 1 = 3 for this second application.
[[input.spells]]
id             = "area"
type           = "target"
shape          = "area"
range          = 4
radius         = 2
stacking       = "increment"
stacking_field = "radius"
stacking_value = 1

[expected]
# Two stacked areas should produce more hexes than one alone,
# but fewer than two full-radius areas would (that's the "weak" part).
hex_count_min = 10
contains_hexes = [[5, 5]]
