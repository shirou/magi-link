# bounce → line: line reflects once off a wall.

name        = "bounce lets line reflect off wall"
description = "Wall reflects direction; line continues backward through caster"

[battlefield]
grid_width  = 20
grid_height = 10

# Player offset (5, 4) → cube (3, 4). Direction 0 advances +Q.
[[battlefield.units]]
id     = 1
name   = "Player"
pos    = [5, 4]
hp     = 100
player = true

# Wall two steps ahead in direction 0 → cube (5, 4) → offset (7, 4).
[[battlefield.terrain]]
pos  = [7, 4]
type = "rock"

[input]
caster    = [5, 4]
clicked   = [10, 4]
direction = 0

[[input.spells]]
ref = "bounce"

[[input.spells]]
id    = "reflected_line"
type  = "target"
shape = "line"
range = 5

[expected]
# 1 step forward before the wall, then reflects and walks backward.
# Minimum 3 unique hexes (1 forward + at least 2 backward through caster).
hex_count_min = 3
