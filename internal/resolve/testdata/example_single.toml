# Example: single target spell selects the clicked hex
# This file demonstrates the basic test case format.

name        = "single target selects clicked hex"
description = "Click on an enemy within range → that hex is in targets"

[battlefield]
grid_width  = 12
grid_height = 10

[[battlefield.units]]
id     = 1
name   = "Player"
pos    = [2, 4]
hp     = 100
player = true

[[battlefield.units]]
id     = 10
name   = "Echo"
pos    = [4, 4]
hp     = 30
player = false

[input]
caster    = [2, 4]
clicked   = [4, 4]
direction = 0

[[input.spells]]
ref = "single"

[expected]
hex_count      = 1
contains_hexes = [[4, 4]]
contains_units = [10]
excludes_units = [1]
