# Magi Link - English Spell Texts

[self]
name        = "Self"
description = "Target the caster"

[single]
name        = "Single"
description = "Select one hex"

[line]
name        = "Line"
description = "Select all hexes in a straight line from caster"

[area]
name        = "Area"
description = "Select all hexes within radius of a point"

[ring]
name        = "Ring"
description = "Select hexes at exact distance from a point"

[adjacent]
name        = "Adjacent"
description = "Select the 6 hexes adjacent to a point"

[weakest]
name        = "Weakest"
description = "Auto-target the enemy with the lowest HP"

[ally]
name        = "Ally"
description = "Target one ally unit"

[fire_filter]
name        = "Fire Filter"
description = "Target all fire floor hexes within radius 5"

[poison_filter]
name        = "Poison Filter"
description = "Target all poison swamp hexes within radius 5"

[electric_filter]
name        = "Elec. Filter"
description = "Target all electric floor hexes within radius 6"

[thorns_filter]
name        = "Thorn Filter"
description = "Target all thorns hexes within radius 5"

[3way]
name        = "3-Way"
description = "Split each origin into 3 directions. The next line fires as three parallel beams"

[pierce]
name        = "Pierce"
description = "The next line action walks through walls and units"

[homing]
name        = "Homing"
description = "Snap each origin to the nearest enemy. The next action fires from those positions"

[bounce]
name        = "Bounce"
description = "The next line reflects once when it hits a wall"

[fireball]
name        = "Fireball"
description = "Fire damage. Applies Burning to targets"

[ice]
name        = "Ice Lance"
description = "Ice damage. Applies Frozen to targets"

[lightning]
name        = "Lightning"
description = "Lightning damage. Applies Electrified. Chains on water"

[water]
name        = "Water"
description = "Water damage. Applies Wet and creates water puddle"

[poison]
name        = "Poison"
description = "Poison damage. Applies Poisoned and creates poison swamp"

[slash]
name        = "Slash"
description = "Physical damage. Applies Bleeding. Destroys breakable walls"

[heal]
name        = "Heal"
description = "Restore HP to targets"

[push]
name        = "Push"
description = "Push targets 1 hex away from caster. New position becomes next target"

[pull]
name        = "Pull"
description = "Pull targets 1 hex toward caster. New position becomes next target"

[wall]
name        = "Wall"
description = "Create a wall on target hexes. Clears the target list"
