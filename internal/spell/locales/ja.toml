# Magi Link - Japanese Spell Texts

[self]
name        = "セルフ"
description = "術者自身を対象にする"

[single]
name        = "シングル"
description = "1つのヘックスを指定する"

[line]
name        = "ライン"
description = "術者から指定方向へ直線上のヘックスすべて"

[area]
name        = "エリア"
description = "指定点から半径内のヘックスすべて"

[ring]
name        = "リング"
description = "指定点から一定距離のヘックス群"

[adjacent]
name        = "アジェイセント"
description = "指定ヘックスに隣接する6マス"

[weakest]
name        = "ウィーケスト"
description = "HP最小の敵1体を自動で対象にする"

[ally]
name        = "アライ"
description = "味方ユニット1体を対象にする"

[fire_filter]
name        = "炎上フィルタ"
description = "半径5内の炎上地形ヘックスすべてを対象にする"

[poison_filter]
name        = "毒沼フィルタ"
description = "半径5内の毒沼ヘックスすべてを対象にする"

[electric_filter]
name        = "感電フィルタ"
description = "半径6内の感電地形ヘックスすべてを対象にする"

[thorns_filter]
name        = "茨フィルタ"
description = "半径5内の茨ヘックスすべてを対象にする"

[fireball]
name        = "ファイアボール"
description = "火属性ダメージ。対象にBurningを付与"

[ice]
name        = "アイスランス"
description = "氷属性ダメージ。対象にFrozenを付与"

[lightning]
name        = "ライトニング"
description = "雷属性ダメージ。対象にElectrifiedを付与。水場で連鎖"

[water]
name        = "ウォーター"
description = "水属性ダメージ。対象にWetを付与し、地面を水たまりにする"

[poison]
name        = "ポイズン"
description = "毒属性ダメージ。対象にPoisonedを付与し、地面を毒沼にする"

[slash]
name        = "スラッシュ"
description = "物理ダメージ。対象にBleedingを付与。破壊可能壁を破壊"

[heal]
name        = "ヒール"
description = "対象のHPを回復する"

[push]
name        = "プッシュ"
description = "対象を術者から1ヘックス遠ざける。移動先が次のターゲットになる"

[pull]
name        = "プル"
description = "対象を術者へ1ヘックス引き寄せる。移動先が次のターゲットになる"

[wall]
name        = "ウォール"
description = "対象ヘックスに壁を生成する。ターゲットリストはクリアされる"
